name: TACTIC V6 Broadcast Act A
run-name: TACTIC V6 Broadcast Act A ${{ github.run_id }}

on:
  push:
    branches:
      - tactic-v6-first-act
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tactic-v6-first-act
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Prepare real match media and TACTIC logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p motion-renderer/public

          SOURCE="https://drive.usercontent.google.com/download?id=1di9B2Jo2v6yxvkYhC-rgcgLZDRqrj8-H&export=download&confirm=t"
          curl -fL --retry 3 --retry-delay 2 "$SOURCE" -o /tmp/v6-goal-source.mp4
          test -s /tmp/v6-goal-source.mp4
          ffprobe -v error -show_entries format=duration,size -of json /tmp/v6-goal-source.mp4

          # Continuous vertical world used behind intro / matchup / score and blurred behind the goal card.
          ffmpeg -hide_banner -loglevel warning -y -ss 4.0 -i /tmp/v6-goal-source.mp4 -t 12.3 \
            -vf "scale=-2:1280,crop=720:1280:(iw-ow)/2:0" \
            -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 160k -ar 48000 -ac 2 -movflags +faststart \
            motion-renderer/public/v6-world-bg.mp4

          # The actual goal stays landscape inside the framed 16:9 broadcast window.
          ffmpeg -hide_banner -loglevel warning -y -ss 8.5 -i /tmp/v6-goal-source.mp4 -t 4.2 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -preset fast -crf 19 -c:a aac -b:a 160k -ar 48000 -ac 2 -movflags +faststart \
            motion-renderer/public/v6-goal-window.mp4

          TACTIC_LOGO="https://drive.usercontent.google.com/download?id=1njAsb_x6rN-el66QpAFKZ0aXWZZYU6Xl&export=download&confirm=t"
          curl -fL --retry 3 --retry-delay 2 "$TACTIC_LOGO" -o motion-renderer/public/TACTIC_SPORT_logo.png

          test -s motion-renderer/public/v6-world-bg.mp4
          test -s motion-renderer/public/v6-goal-window.mp4
          test -s motion-renderer/public/TACTIC_SPORT_logo.png
          file motion-renderer/public/TACTIC_SPORT_logo.png

      - name: Validate visual assets
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://imagecache.365scores.com/image/upload/f_png,c_limit,q_auto:eco,dpr_1/Competitors/1169" \
            "https://r2.thesportsdb.com/images/media/team/badge/cgvxt61785930389.png" \
            "https://r2.thesportsdb.com/images/media/league/badge/facv1u1742998896.png"; do
            curl -fLsS --retry 3 --range 0-0 -o /dev/null "$url"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build renderer image
        uses: docker/build-push-action@v6
        with:
          context: ./motion-renderer
          file: ./motion-renderer/Dockerfile
          load: true
          tags: tactic-v6-broadcast-act-a:latest
          cache-from: type=gha,scope=tactic-v6-first-act
          cache-to: type=gha,mode=max,scope=tactic-v6-first-act

      - name: Start renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered state qa
          docker run -d --name tactic-v6-broadcast-act-a \
            -p 18080:80 \
            -e PORT=80 \
            -e PUBLIC_URL=http://127.0.0.1:18080 \
            -v "$PWD/rendered:/app/renders" \
            -v "$PWD/state:/app/state" \
            tactic-v6-broadcast-act-a:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs tactic-v6-broadcast-act-a || true
          exit 1

      - name: Render 12 second broadcast act A
        shell: bash
        run: |
          set -euo pipefail
          cp motion-renderer/examples/test-payload.json render-payload.json
          response="$(curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @render-payload.json http://127.0.0.1:18080/renders)"
          echo "$response" | tee create-job.json
          job_id="$(echo "$response" | jq -er '.jobId')"
          echo "job_id=$job_id" >> "$GITHUB_ENV"
          for i in $(seq 1 180); do
            status_json="$(curl -fsS http://127.0.0.1:18080/renders/${job_id})"
            status="$(echo "$status_json" | jq -r '.status')"
            progress="$(echo "$status_json" | jq -r '.progress // 0')"
            echo "status=$status progress=$progress"
            if [ "$status" = completed ]; then
              test -s "rendered/${job_id}.mp4"
              exit 0
            fi
            if [ "$status" = failed ]; then
              echo "$status_json" | jq .
              docker logs tactic-v6-broadcast-act-a || true
              exit 1
            fi
            sleep 6
          done
          exit 1

      - name: Verify and create QA sheet
        shell: bash
        run: |
          set -euo pipefail
          file="rendered/${job_id}.mp4"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height -of json "$file" | tee qa/media-info.json
          ffmpeg -hide_banner -loglevel warning -y -i "$file" \
            -vf "select='eq(n,12)+eq(n,55)+eq(n,92)+eq(n,145)+eq(n,180)+eq(n,210)+eq(n,275)+eq(n,330)',scale=270:480,tile=4x2" \
            -vsync vfr -frames:v 1 qa/v6-broadcast-act-a-contact-sheet.jpg
          test -s qa/v6-broadcast-act-a-contact-sheet.jpg

      - name: Upload broadcast act A to TACTIC Motion storage
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          file="rendered/${job_id}.mp4"
          response="$(curl -fsS --retry 3 --retry-delay 3 --retry-all-errors \
            -X POST -H 'Content-Type: video/mp4' \
            -H 'x-file-name: tactic-v6-act-a-framed-goal-aston-villa-club-brugge.mp4' \
            -H 'x-game-id: 4828501' \
            -H 'x-media-type: v6_broadcast_act_a' \
            --data-binary "@${file}" \
            'https://personal-tactic-motion.8kospi.easypanel.host/assets')"
          echo "$response" | tee qa/upload-result.json
          echo "result_url=$(echo "$response" | jq -er '.url')" >> "$GITHUB_OUTPUT"

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactic-v6-broadcast-act-a-${{ github.run_id }}
          path: |
            rendered/${{ env.job_id }}.mp4
            qa/v6-broadcast-act-a-contact-sheet.jpg
            qa/media-info.json
            qa/upload-result.json
            render-payload.json
          retention-days: 3
          if-no-files-found: error
