name: Operations Dashboard CI
on:
  push:
    branches:
      - feat/tactic-operations-dashboard-v1
    paths:
      - "operations-dashboard/**"
      - ".github/workflows/operations-dashboard-ci.yml"
  pull_request:
    paths:
      - "operations-dashboard/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operations-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: operations-dashboard/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SUPABASE_URL: https://bfivqrqsojwmeeuptjxw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
