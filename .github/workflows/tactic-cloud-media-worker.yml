name: TACTIC Cloud Media Worker

on:
  repository_dispatch:
    types: [tactic-cloud-video-download]

permissions:
  contents: read

jobs:
  download-upload-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      FILE_NAME: ${{ github.event.client_payload.file_name }}
      OBJECT_KEY: ${{ github.event.client_payload.object_key }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}

      # Reuse the existing TACTIC R2 setup. Secrets override these known non-secret defaults.
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || 'https://6c71b5d884d0afd67c85fc37e213096d.r2.cloudflarestorage.com' }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'tactic-motion' }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || secrets.R2_PUBLIC_BASE_URL || 'https://pub-6d1819d54f1a42cfadaa46445de89b81.r2.dev' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate R2 credentials
        run: |
          test -n "$R2_ACCESS_KEY_ID" || { echo 'Missing R2_ACCESS_KEY_ID'; exit 11; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'Missing R2_SECRET_ACCESS_KEY'; exit 12; }

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq file awscli

      - name: Download and upload to R2
        id: media
        run: |
          chmod +x cloud-media-worker/download_to_r2.sh
          cloud-media-worker/download_to_r2.sh

      - name: Build callback payload
        if: success()
        env:
          ORIGINAL_META: ${{ toJson(github.event.client_payload.meta) }}
        run: |
          printf '%s' "$ORIGINAL_META" > work/meta.json
          jq -s '.[0] + {meta: .[1]}' work/result.json work/meta.json > work/callback.json
          cat work/callback.json

      - name: Callback n8n success
        if: success()
        run: |
          test -n "$CALLBACK_URL"
          curl -fL --retry 5 --retry-delay 3 \
            -H 'Content-Type: application/json' \
            --data-binary @work/callback.json \
            "$CALLBACK_URL"

      - name: Callback n8n failure
        if: failure() && env.CALLBACK_URL != ''
        env:
          ORIGINAL_META: ${{ toJson(github.event.client_payload.meta) }}
        run: |
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --argjson meta "$ORIGINAL_META" \
            '{request_id:$request_id,status:"failed",error:"cloud_media_worker_failed",meta:$meta}' > /tmp/failure.json
          curl -sS -L --retry 3 --retry-delay 3 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/failure.json \
            "$CALLBACK_URL" || true
