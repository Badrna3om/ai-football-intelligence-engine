name: SNAP AMER Goal Reel Render
run-name: SNAP AMER Goal Reel ${{ github.event.client_payload.request_id || github.run_id }}

on:
  repository_dispatch:
    types:
      - tactic-goal-reel-render
  push:
    branches: [main]
    paths:
      - .github/workflows/tactic-goal-reel-render.yml

permissions:
  contents: read

concurrency:
  group: snap-amer-goal-reel-${{ github.event.client_payload.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            jq -e '.client_payload.render_payload | type == "object"' "$GITHUB_EVENT_PATH" >/dev/null
            jq '.client_payload.render_payload' "$GITHUB_EVENT_PATH" > render-payload.json
          else
            cat > render-payload.json <<'JSON'
          {
            "compositionId":"TacticGoalReel",
            "gameId":4789450,
            "homeTeam":"النصر",
            "awayTeam":"نيوم",
            "competitionName":"الدوري السعودي",
            "roundName":"الجولة 10",
            "venueName":"استاد الملك فهد الدولي",
            "matchDate":"20 أكتوبر 2026",
            "homeScore":1,
            "awayScore":0,
            "assets":{
              "brandLogoUrl":"https://personal-tactic-motion.8kospi.easypanel.host/assets/snapamer.webp",
              "stadiumBackgroundUrl":"https://personal-tactic-motion.8kospi.easypanel.host/assets/match_presentation_stadium_locked.jpg",
              "homeBadgeUrl":"https://personal-tactic-motion.8kospi.easypanel.host/assets/8bf0b19a-5266-4976-8f41-d8301ba1bcdf.png",
              "awayBadgeUrl":"https://personal-tactic-motion.8kospi.easypanel.host/assets/3ac71dc7-26db-41a2-9ca3-7a5658520372.png",
              "competitionLogoUrl":"https://personal-tactic-motion.8kospi.easypanel.host/assets/f8f159f3-ff00-4cdc-9f1b-70956063c278.png",
              "homePrimaryColor":"#F4D019",
              "awayPrimaryColor":"#2EA3E0"
            },
            "goals":[{
              "minute":61,
              "scorerName":"جواو فيليكس",
              "teamName":"النصر",
              "scoreAfter":"1 - 0",
              "videoUrl":"https://personal-tactic-motion.8kospi.easypanel.host/assets/ddac7a42-52c3-4965-9102-6ea42662f48e.mp4",
              "clipStartSeconds":5.5,
              "clipDurationSeconds":12.5,
              "durationInSeconds":12.5,
              "teamColor":"#F4D019"
            }]
          }
          JSON
          fi
          jq -e '.gameId and (.goals | type == "array") and (.goals | length > 0)' render-payload.json >/dev/null
          jq -e '.goals as $goals | [$goals[] | select(.videoUrl != null and .videoUrl != "")] | length == ($goals | length)' render-payload.json >/dev/null
          game_id="$(jq -r '.gameId' render-payload.json)"
          composition_id="$(jq -r '.compositionId // "TacticGoalReel"' render-payload.json)"
          echo "game_id=${game_id}" >> "$GITHUB_ENV"
          echo "composition_id=${composition_id}" >> "$GITHUB_ENV"

      - name: Validate goal video URLs
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.goals[].videoUrl' render-payload.json | while read -r url; do
            curl -fLsS --retry 4 --retry-delay 2 --range 0-0 -o /dev/null "$url"
          done

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          cd motion-renderer
          npm install --no-audit --no-fund

      - name: Stage Snap Amer brand logo locally
        shell: bash
        run: |
          set -euo pipefail
          brand_url="$(jq -r '.assets.brandLogoUrl // .brandLogoUrl // empty' render-payload.json)"
          if [ -n "$brand_url" ]; then
            mkdir -p motion-renderer/public
            curl -fLsS --retry 5 --retry-delay 2 "$brand_url" -o motion-renderer/public/snap-amer-logo.png
            test -s motion-renderer/public/snap-amer-logo.png
            python3 - <<'PY'
          import json
          p='render-payload.json'; data=json.load(open(p))
          data.setdefault('assets',{})['brandLogoUrl']='/snap-amer-logo.png'
          with open(p,'w') as f: json.dump(data,f,ensure_ascii=False)
          PY
          fi

      - name: Stage full goal clips locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p motion-renderer/public
          count="$(jq '.goals | length' render-payload.json)"
          for ((i=0; i<count; i++)); do
            url="$(jq -r ".goals[$i].videoUrl" render-payload.json)"
            local_file="motion-renderer/public/goal-${i}.mp4"
            curl -fLsS --retry 5 --retry-delay 2 "$url" -o "$local_file"
            test -s "$local_file"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$local_file" | head -1)"
            python3 - "$i" "$duration" <<'PY'
          import json,sys
          idx=int(sys.argv[1]); source_duration=float(sys.argv[2])
          p='render-payload.json'; data=json.load(open(p)); g=data['goals'][idx]
          g['sourceDurationInSeconds']=source_duration
          if not isinstance(g.get('durationInSeconds'),(int,float)) or g['durationInSeconds'] <= 0:
              g['durationInSeconds']=min(12.0,source_duration)
          g['videoUrl']=f'/goal-{idx}.mp4'
          with open(p,'w') as f: json.dump(data,f,ensure_ascii=False)
          PY
          done
          jq '.goals | map({minute, scorerName, teamName, scoreAfter, clipStartSeconds, clipDurationSeconds, durationInSeconds, sourceDurationInSeconds, videoUrl})' render-payload.json

      - name: Render Goal Reel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          cd motion-renderer
          npx remotion render remotion/index.ts "$composition_id" ../rendered/goal-reel.mp4 \
            --props=../render-payload.json \
            --codec=h264 \
            --concurrency=4 \
            --jpeg-quality=90

      - name: Verify final MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s rendered/goal-reel.mp4
          ffprobe -v error -show_entries format=duration,size -of json rendered/goal-reel.mp4 | tee final-media-info.json
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height -of json rendered/goal-reel.mp4 | tee final-stream-info.json
          jq -e '.format.duration | tonumber > 3' final-media-info.json >/dev/null
          jq -e '.format.size | tonumber > 100000' final-media-info.json >/dev/null
          jq -e '[.streams[] | select(.codec_type == "video")][0] | .width == 1080 and .height == 1920' final-stream-info.json >/dev/null

      - name: Upload Goal Reel to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          object_key="game-${game_id}-${GITHUB_RUN_ID}-goal-reel.mp4"
          aws s3 cp rendered/goal-reel.mp4 "s3://${R2_BUCKET}/${object_key}" --endpoint-url "$R2_ENDPOINT" --content-type video/mp4 --cache-control "public,max-age=31536000,immutable" --only-show-errors
          result_url="${R2_PUBLIC_URL%/}/${object_key}"
          curl -fLsS --retry 5 --retry-delay 2 --range 0-0 -o /dev/null "$result_url"
          printf '{"ok":true,"gameId":%s,"objectKey":"%s","resultUrl":"%s"}\n' "$game_id" "$object_key" "$result_url" | tee rendered/result.json

      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-amer-goal-reel-${{ env.game_id }}-${{ github.run_id }}
          path: |
            render-payload.json
            rendered/goal-reel.mp4
            rendered/result.json
            final-media-info.json
            final-stream-info.json
          retention-days: 3
          if-no-files-found: ignore
