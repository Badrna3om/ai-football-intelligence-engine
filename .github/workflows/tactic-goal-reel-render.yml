name: SNAP AMER Goal Reel Render
run-name: SNAP AMER Goal Reel ${{ github.event.client_payload.request_id || github.event.head_commit.message || github.run_id }}

on:
  repository_dispatch:
    types:
      - tactic-goal-reel-render
  push:
    branches: [main]
    paths:
      - 'render-requests/**.json'

permissions:
  contents: read

concurrency:
  group: snap-amer-goal-reel-${{ github.event.client_payload.request_id || github.event.head_commit.message || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            jq -e '.client_payload.render_payload | type == "object"' "$GITHUB_EVENT_PATH" >/dev/null
            jq '.client_payload.render_payload' "$GITHUB_EVENT_PATH" > render-payload.json
            request_id="$(jq -r '.client_payload.request_id // empty' "$GITHUB_EVENT_PATH")"
          else
            commit_message="$(jq -r '.head_commit.message // empty' "$GITHUB_EVENT_PATH")"
            case "$commit_message" in
              render-request:*) request_id="${commit_message#render-request:}" ;;
              *) echo "Invalid render request commit message: $commit_message" >&2; exit 1 ;;
            esac
            request_file="render-requests/${request_id}.json"
            test -s "$request_file"
            jq -e '.render_payload | type == "object"' "$request_file" >/dev/null
            jq '.render_payload' "$request_file" > render-payload.json
          fi
          jq -e '.gameId and (.goals | type == "array") and (.goals | length > 0)' render-payload.json >/dev/null
          jq -e '.goals as $goals | [$goals[] | select(.videoUrl != null and .videoUrl != "")] | length == ($goals | length)' render-payload.json >/dev/null
          game_id="$(jq -r '.gameId' render-payload.json)"
          composition_id="$(jq -r '.compositionId // "TacticGoalReel"' render-payload.json)"
          echo "request_id=${request_id}" >> "$GITHUB_ENV"
          echo "game_id=${game_id}" >> "$GITHUB_ENV"
          echo "composition_id=${composition_id}" >> "$GITHUB_ENV"

      - name: Validate goal video URLs
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.goals[].videoUrl' render-payload.json | while read -r url; do
            curl -fLsS --retry 4 --retry-delay 2 --range 0-0 -o /dev/null "$url"
          done

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          cd motion-renderer
          npm install --no-audit --no-fund

      - name: Validate Snap Amer brand logo
        shell: bash
        run: |
          set -euo pipefail
          brand_url="$(jq -r '.assets.brandLogoUrl // .brandLogoUrl // empty' render-payload.json)"
          if [ -n "$brand_url" ]; then
            curl -fLsS --retry 5 --retry-delay 2 --range 0-0 -o /dev/null "$brand_url"
          fi

      - name: Stage goal clips locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p motion-renderer/public
          count="$(jq '.goals | length' render-payload.json)"
          for ((i=0; i<count; i++)); do
            url="$(jq -r ".goals[$i].videoUrl" render-payload.json)"
            local_file="motion-renderer/public/goal-${i}.mp4"
            curl -fLsS --retry 5 --retry-delay 2 "$url" -o "$local_file"
            test -s "$local_file"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$local_file" | head -1)"
            python3 - "$i" "$duration" <<'PY'
          import json,sys
          idx=int(sys.argv[1]); source_duration=float(sys.argv[2])
          p='render-payload.json'; data=json.load(open(p)); g=data['goals'][idx]
          g['sourceDurationInSeconds']=source_duration
          g['videoUrl']=f'/goal-{idx}.mp4'
          with open(p,'w') as f: json.dump(data,f,ensure_ascii=False)
          PY
          done

      - name: Render Goal Reel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          cd motion-renderer
          npx remotion render remotion/index.ts "$composition_id" ../rendered/goal-reel.mp4 \
            --props=../render-payload.json \
            --codec=h264 \
            --concurrency=4 \
            --jpeg-quality=90

      - name: Verify final MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s rendered/goal-reel.mp4
          ffprobe -v error -show_entries format=duration,size -of json rendered/goal-reel.mp4 | tee final-media-info.json
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height -of json rendered/goal-reel.mp4 | tee final-stream-info.json
          jq -e '.format.duration | tonumber > 3' final-media-info.json >/dev/null
          jq -e '.format.size | tonumber > 100000' final-media-info.json >/dev/null
          jq -e '[.streams[] | select(.codec_type == "video")][0] | .width == 1080 and .height == 1920' final-stream-info.json >/dev/null

      - name: Prepare Telegram copy — preserve 1080x1920
        shell: bash
        run: |
          set -euo pipefail
          master="rendered/goal-reel.mp4"
          telegram="rendered/goal-reel-telegram.mp4"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$master" | head -1)"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$master" | head -1)"
          [ "$width" = "1080" ] && [ "$height" = "1920" ] || { echo "Master dimensions are ${width}x${height}, expected 1080x1920" >&2; exit 1; }
          size="$(stat -c%s "$master")"
          if [ "$size" -lt 48000000 ]; then
            cp "$master" "$telegram"
          else
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$master" | head -1)"
            for target_bytes in 45000000 42000000 39000000; do
              video_bps="$(python3 - "$duration" "$target_bytes" <<'PY'
          import sys
          duration=max(float(sys.argv[1]),1.0)
          target_bytes=int(sys.argv[2])
          audio_bps=96000
          safety_bps=24000
          total_bps=(target_bytes*8)/duration
          print(max(250000,int(total_bps-audio_bps-safety_bps)))
          PY
              )"
              ffmpeg -hide_banner -loglevel error -y -i "$master" \
                -map 0:v:0 -map '0:a?' \
                -c:v libx264 -preset veryfast -b:v "$video_bps" -maxrate "$video_bps" -bufsize "$((video_bps*2))" \
                -c:a aac -b:a 96k -pix_fmt yuv420p -movflags +faststart "$telegram"
              out_size="$(stat -c%s "$telegram")"
              [ "$out_size" -lt 49000000 ] && break
            done
          fi
          test -s "$telegram"
          telegram_width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$telegram" | head -1)"
          telegram_height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$telegram" | head -1)"
          telegram_size="$(stat -c%s "$telegram")"
          [ "$telegram_width" = "1080" ] && [ "$telegram_height" = "1920" ] || { echo "Telegram copy dimensions changed to ${telegram_width}x${telegram_height}" >&2; exit 1; }
          [ "$telegram_size" -lt 49000000 ] || { echo "Telegram copy too large: $telegram_size" >&2; exit 1; }
          echo "Telegram delivery copy: ${telegram_width}x${telegram_height}, ${telegram_size} bytes"

      - name: Upload Goal Reel to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          object_key="game-${game_id}-${GITHUB_RUN_ID}-goal-reel.mp4"
          telegram_key="game-${game_id}-${GITHUB_RUN_ID}-goal-reel-telegram.mp4"
          aws s3 cp rendered/goal-reel.mp4 "s3://${R2_BUCKET}/${object_key}" --endpoint-url "$R2_ENDPOINT" --content-type video/mp4 --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 cp rendered/goal-reel-telegram.mp4 "s3://${R2_BUCKET}/${telegram_key}" --endpoint-url "$R2_ENDPOINT" --content-type video/mp4 --cache-control "public,max-age=31536000,immutable" --only-show-errors
          result_url="${R2_PUBLIC_URL%/}/${object_key}"
          telegram_url="${R2_PUBLIC_URL%/}/${telegram_key}"
          curl -fLsS --retry 5 --retry-delay 2 --range 0-0 -o /dev/null "$result_url"
          curl -fLsS --retry 5 --retry-delay 2 --range 0-0 -o /dev/null "$telegram_url"
          telegram_size="$(stat -c%s rendered/goal-reel-telegram.mp4)"
          printf '{"ok":true,"gameId":%s,"requestId":"%s","objectKey":"%s","resultUrl":"%s","telegramObjectKey":"%s","telegramResultUrl":"%s","telegramSizeBytes":%s}\n' "$game_id" "$request_id" "$object_key" "$result_url" "$telegram_key" "$telegram_url" "$telegram_size" | tee rendered/result.json

      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-amer-goal-reel-${{ env.game_id }}-${{ github.run_id }}
          path: |
            render-payload.json
            rendered/goal-reel.mp4
            rendered/goal-reel-telegram.mp4
            rendered/result.json
            final-media-info.json
            final-stream-info.json
          retention-days: 3
          if-no-files-found: ignore
