name: TACTIC Motion Render
run-name: TACTIC Motion ${{ github.event.client_payload.request_id || github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - "motion-renderer/**"
  workflow_dispatch:
    inputs:
      payload_mode:
        description: "Render payload source"
        required: true
        type: choice
        default: test
        options:
          - test
          - json
      payload_json:
        description: "Full render_payload JSON when payload_mode=json"
        required: false
        type: string
      upload_result_to_motion:
        description: "Upload completed MP4 to Cloudflare R2"
        required: true
        type: boolean
        default: true
  repository_dispatch:
    types:
      - tactic-motion-render

permissions:
  contents: read

concurrency:
  group: tactic-motion-${{ github.event.client_payload.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render TACTIC Motion
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare render payload
        shell: bash
        env:
          MANUAL_PAYLOAD_MODE: ${{ inputs.payload_mode }}
          MANUAL_PAYLOAD_JSON: ${{ inputs.payload_json }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            jq -e '.client_payload.render_payload | type == "object"' "$GITHUB_EVENT_PATH" >/dev/null
            jq '.client_payload.render_payload' "$GITHUB_EVENT_PATH" > render-payload.json
          elif [ "${MANUAL_PAYLOAD_MODE:-test}" = "json" ]; then
            test -n "${MANUAL_PAYLOAD_JSON:-}"
            printf '%s' "$MANUAL_PAYLOAD_JSON" | jq -e '.' > render-payload.json
          else
            cp motion-renderer/examples/test-payload.json render-payload.json
          fi
          jq -e '.gameId and .homeTeam and .awayTeam' render-payload.json >/dev/null
          game_id="$(jq -r '.gameId' render-payload.json)"
          echo "game_id=${game_id}" >> "$GITHUB_ENV"
          echo "Rendering game ${game_id}: $(jq -r '.homeTeam' render-payload.json) vs $(jq -r '.awayTeam' render-payload.json)"

      - name: Validate remote media assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path('render-payload.json').read_text())
          urls=[]
          assets=p.get('assets') or {}
          for label,url in [
            ('highlights',p.get('highlightsVideoUrl')),
            ('home_badge',assets.get('homeBadgeUrl')),
            ('away_badge',assets.get('awayBadgeUrl')),
            ('competition_logo',assets.get('competitionLogoUrl')),
            ('tactic_logo',assets.get('tacticLogoUrl')),
            ('star_player',assets.get('starPlayerPhotoUrl')),
          ]:
            if url: urls.append((label,url))
          for i,g in enumerate(p.get('goals') or []):
            if isinstance(g,dict) and g.get('videoUrl'): urls.append((f'goal_{i+1}',g['videoUrl']))
          for label,url in urls:
            print(f'Checking {label}: {url}')
            subprocess.run(['curl','-fLsS','--retry','3','--retry-delay','2','--range','0-0','-o','/dev/null',url],check=True)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build renderer image
        uses: docker/build-push-action@v6
        with:
          context: ./motion-renderer
          file: ./motion-renderer/Dockerfile
          load: true
          tags: tactic-motion-actions:7.0
          cache-from: type=gha,scope=tactic-motion-renderer
          cache-to: type=gha,mode=max,scope=tactic-motion-renderer

      - name: Start local renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered state
          docker run -d \
            --name tactic-motion-actions \
            -p 18080:80 \
            -e PORT=80 \
            -e PUBLIC_URL=http://127.0.0.1:18080 \
            -v "$PWD/rendered:/app/renders" \
            -v "$PWD/state:/app/state" \
            tactic-motion-actions:7.0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health > health.json 2>/dev/null; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker logs tactic-motion-actions || true
          exit 1

      - name: Create render job
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @render-payload.json http://127.0.0.1:18080/renders)"
          printf '%s\n' "$response" | tee create-job.json
          job_id="$(printf '%s' "$response" | jq -er '.jobId')"
          echo "job_id=${job_id}" >> "$GITHUB_ENV"
          echo "$job_id" > job-id.txt

      - name: Wait for render completion
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            status_json="$(curl -fsS "http://127.0.0.1:18080/renders/${job_id}")"
            printf '%s\n' "$status_json" > render-status.json
            status="$(printf '%s' "$status_json" | jq -r '.status')"
            progress="$(printf '%s' "$status_json" | jq -r '.progress // 0')"
            elapsed="$(printf '%s' "$status_json" | jq -r '.elapsedSeconds // 0')"
            echo "status=${status} progress=${progress} elapsed=${elapsed}s"
            if [ "$status" = "completed" ]; then
              test -s "rendered/${job_id}.mp4"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              printf '%s\n' "$status_json" | jq .
              docker logs tactic-motion-actions || true
              exit 1
            fi
            sleep 15
          done
          docker logs tactic-motion-actions || true
          exit 1

      - name: Install FFmpeg on runner
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi

      - name: Create v7 stadium pulse music and master audio
        shell: bash
        run: |
          set -euo pipefail
          input="rendered/${job_id}.mp4"
          tmp="rendered/${job_id}.master.mp4"
          test -s "$input"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$input")"
          export TACTIC_AUDIO_DURATION="$duration"
          python3 - <<'PY'
          import math, os, wave
          from array import array
          duration=max(1.0,float(os.environ['TACTIC_AUDIO_DURATION']))
          run_id=int(os.environ.get('GITHUB_RUN_ID','1'))
          variant=run_id%6
          bpms=[126,128,130,132,134,136]
          roots=[48.999,55.0,58.27,61.74,65.41,73.42]
          progressions=[[0,3,7,5],[0,5,7,3],[0,7,3,5],[0,5,8,7],[0,3,8,5],[0,7,5,8]]
          bpm=bpms[variant];root=roots[variant];prog=progressions[variant]
          beat=60.0/bpm; bar=beat*4; sr=48000; total=int(duration*sr); out=array('h')
          def envexp(x,k): return math.exp(-k*x)
          for i in range(total):
            t=i/sr; bp=t%beat; q=t%(beat/4); bi=int(t/beat); bari=int(t/bar)
            base=root*(2**(prog[bari%4]/12)); fade=min(1,t/1.4)*min(1,max(0,duration-t)/1.8)
            kick=0
            if bp<.18:
              e=envexp(bp,22); freq=58-20*min(1,bp/.18); kick=.20*e*math.sin(2*math.pi*freq*t)
            tom=0
            if bi%4 in (1,3) and bp<.20:
              tom=.075*envexp(bp,15)*math.sin(2*math.pi*(92 if bi%4==1 else 116)*t)
            bass=.12*min(1,bp/.025)*envexp(bp,3.4)*math.sin(2*math.pi*base*t)
            stab_phase=t%(beat*2)
            stab=0
            if stab_phase<.30:
              e=envexp(stab_phase,7)
              stab=.040*e*(math.sin(2*math.pi*base*4*t)+.55*math.sin(2*math.pi*base*5.04*t))
            arp_e=min(1,q/.012)*envexp(q,12)
            arp_step=[0,7,12,10][(bi*4+int((t%beat)/(beat/4)))%4]
            arp=.034*arp_e*math.sin(2*math.pi*base*4*(2**(arp_step/12))*t)
            pulse=.018*math.sin(2*math.pi*(base*2)*t)+.012*math.sin(2*math.pi*(base*3.01)*t)
            lift=.86+.14*math.sin(2*math.pi*t/(bar*2))
            left=(kick+tom+bass+stab+arp+pulse)*fade*lift
            right=(kick+tom+bass+stab+arp*.96+pulse*.9)*fade*lift
            left=max(-.84,min(.84,left));right=max(-.84,min(.84,right))
            out.append(int(left*32767));out.append(int(right*32767))
          with wave.open('sports-bed.wav','wb') as w:
            w.setnchannels(2);w.setsampwidth(2);w.setframerate(sr);w.writeframes(out.tobytes())
          with open('sports-music.env','w',encoding='utf-8') as e:
            e.write(f'MUSIC_VARIANT=stadium-pulse-{variant+1}\nMUSIC_BPM={bpm}\n')
          print(f'v7 stadium pulse variant={variant+1} bpm={bpm} duration={duration:.2f}s')
          PY
          source sports-music.env
          echo "music_variant=${MUSIC_VARIANT}" >> "$GITHUB_ENV"
          echo "music_bpm=${MUSIC_BPM}" >> "$GITHUB_ENV"
          has_audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of default=nw=1:nk=1 "$input" 2>/dev/null || true)"
          if [ -n "$has_audio" ]; then
            ffmpeg -hide_banner -loglevel warning -y \
              -i "$input" -i sports-bed.wav \
              -filter_complex "[1:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=0.18[music];[music][0:a]sidechaincompress=threshold=0.022:ratio=6:attack=28:release=720[ducked];[ducked][0:a]amix=inputs=2:duration=first:weights='0.76 1.0':normalize=0,alimiter=limit=0.93[aout]" \
              -map 0:v:0 -map "[aout]" -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart -shortest "$tmp"
          else
            ffmpeg -hide_banner -loglevel warning -y \
              -i "$input" -i sports-bed.wav \
              -filter_complex "[1:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=0.22,alimiter=limit=0.91[aout]" \
              -map 0:v:0 -map "[aout]" -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart -shortest "$tmp"
          fi
          test -s "$tmp"
          before="$duration"; after="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$tmp")"
          python3 - "$before" "$after" <<'PY'
          import sys
          a,b=map(float,sys.argv[1:3])
          if a<1 or b<1 or abs(a-b)>1: raise SystemExit(f'Invalid duration before={a} after={b}')
          PY
          mv "$tmp" "$input"

      - name: Verify final MP4
        shell: bash
        run: |
          set -euo pipefail
          file="rendered/${job_id}.mp4"
          test -s "$file"
          ffprobe -v error -show_entries format=duration,size -of json "$file" | tee final-media-info.json
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,sample_rate,channels -of json "$file" | tee final-stream-info.json
          jq -e '.format.duration | tonumber > 1' final-media-info.json >/dev/null
          jq -e '.format.size | tonumber > 100000' final-media-info.json >/dev/null
          jq -e '[.streams[] | select(.codec_type == "video")][0] | .width == 1080 and .height == 1920' final-stream-info.json >/dev/null
          jq -e '[.streams[] | select(.codec_type == "audio")][0] | (.sample_rate | tonumber) == 48000 and .channels == 2' final-stream-info.json >/dev/null

      - name: Upload final MP4 to Cloudflare R2
        id: publish
        if: ${{ success() && (github.event_name == 'repository_dispatch' || inputs.upload_result_to_motion) }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}"
          test -n "${AWS_SECRET_ACCESS_KEY:-}"
          test -n "${R2_ENDPOINT:-}"
          test -n "${R2_BUCKET:-}"
          test -n "${R2_PUBLIC_URL:-}"
          file="rendered/${job_id}.mp4"
          object_key="game-${game_id}-final-motion.mp4"
          aws s3 cp "$file" "s3://${R2_BUCKET}/${object_key}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "video/mp4" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
          result_url="${R2_PUBLIC_URL%/}/${object_key}"
          curl -fLsS --retry 5 --retry-delay 2 --range 0-0 -o /dev/null "$result_url"
          printf '{"ok":true,"storage":"cloudflare-r2","bucket":"%s","objectKey":"%s","url":"%s"}\n' "$R2_BUCKET" "$object_key" "$result_url" | tee uploaded-result.json
          echo "result_url=${result_url}" >> "$GITHUB_OUTPUT"

      - name: Build result manifest
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          result_url=""
          if [ -f uploaded-result.json ]; then result_url="$(jq -r '.url // empty' uploaded-result.json)"; fi
          jq -n \
            --arg jobId "$job_id" \
            --arg gameId "$game_id" \
            --arg resultUrl "$result_url" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg musicVariant "${music_variant:-unknown}" \
            --arg musicBpm "${music_bpm:-unknown}" \
            '{ok:true,renderer:"github-actions",storage:"cloudflare-r2",template:"TACTIC_MASTER_V1",jobId:$jobId,gameId:($gameId|tonumber),resultUrl:(if $resultUrl=="" then null else $resultUrl end),githubRunId:($runId|tonumber),repository:$repository,musicVariant:$musicVariant,musicBpm:$musicBpm}' | tee rendered/result.json

      - name: Upload rendered video artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: tactic-motion-${{ env.game_id }}-${{ github.run_id }}
          path: |
            rendered/${{ env.job_id }}.mp4
            rendered/result.json
            final-media-info.json
            final-stream-info.json
          retention-days: 3
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          docker logs tactic-motion-actions > renderer.log 2>&1 || true

      - name: Save failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tactic-motion-failure-${{ github.run_id }}
          path: |
            renderer.log
            render-payload.json
            render-status.json
            create-job.json
            final-media-info.json
            final-stream-info.json
            sports-music.env
          retention-days: 3
          if-no-files-found: ignore
